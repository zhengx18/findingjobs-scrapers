# RSS / Atom feeds fetched by rss.py.
# Each feed becomes one JSON file in data/rss/{slug}.json.
# items get joined into data/all_rss_jobs.json which findingJobs consumes
# via the github_relay connector.

feeds:
  - slug: hn-jobs
    name: HN Jobs (YC companies hiring)
    url: https://hnrss.org/jobs
    market: global
    pool: watch
    tags: [aggregator, hn, yc, llm]

  - slug: v2ex-jobs
    name: V2EX 招聘节点
    url: https://www.v2ex.com/feed/tab/jobs.xml
    market: cn
    pool: watch
    tags: [aggregator, v2ex, cn]
    # Only keep items whose title/desc match any of these keywords
    include_keywords: [大模型, llm, 算法, agent, post-training, 后训练, sft, rlhf, vlm, mllm, machine learning, ml]

