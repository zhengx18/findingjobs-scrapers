name: scrape-jobs

on:
  schedule:
    # 01:30 UTC = 09:30 Beijing — runs before findingJobs cron at 10:00
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrape
        run: python scrape.py

      - name: Commit results
        run: |
          git config user.name "scraper-bot"
          git config user.email "scraper-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "scrape $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
