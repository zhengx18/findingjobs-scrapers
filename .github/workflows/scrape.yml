name: scrape-jobs

on:
  schedule:
    - cron: '30 1 * * *'   # 09:30 Beijing — before findingJobs cron at 10:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python rss.py
        continue-on-error: true
      - run: |
          git config user.name "scraper-bot"
          git config user.email "scraper-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "rss $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
